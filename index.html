<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <title>Yadgir District - Karnataka | Enterprise Web GIS Portal</title>

        <!-- Local QGIS2Web CSS References -->
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <!-- Modern GIS Web App CDNs -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.4.0/ol.css">
        <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <script src="https://cdn.tailwindcss.com"></script>

        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background-color: #0f172a;
            }

            #map {
                width: 100vw;
                height: 100vh;
                position: relative;
            }

            /* Hide raw unstyled qgis2web default overlays */
            .ol-layerswitcher, .layer-switcher {
                display: none !important;
            }

            /* Enterprise UI Panel Base Styling */
            .gis-glass-panel {
                background: rgba(15, 23, 42, 0.88);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
                color: #f8fafc;
            }

            /* Header Bar */
            .top-header {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 56px;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                background: #0f172a;
                border-bottom: 1px solid #1e293b;
            }

            /* Left Toolbar Container */
            .left-toolbar {
                position: absolute;
                top: 70px;
                left: 16px;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .gis-btn-icon {
                width: 44px;
                height: 44px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
                font-size: 18px;
            }

            .gis-btn-icon:hover {
                transform: translateX(2px);
            }

            /* Left Drawer Sidebar for Layers */
            .left-sidebar-drawer {
                position: absolute;
                top: 70px;
                left: 70px;
                z-index: 999;
                width: 320px;
                max-height: calc(100vh - 120px);
                border-radius: 14px;
                display: flex;
                flex-direction: column;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                opacity: 1;
                transform: translateX(0);
            }

            .left-sidebar-drawer.closed {
                opacity: 0;
                transform: translateX(-20px);
                pointer-events: none;
            }

            .layer-scroll-container {
                overflow-y: auto;
                max-height: calc(100vh - 200px);
            }

            .layer-scroll-container::-webkit-scrollbar {
                width: 6px;
            }
            .layer-scroll-container::-webkit-scrollbar-thumb {
                background: #334155;
                border-radius: 4px;
            }

            /* Customized OpenLayers Controls */
            .ol-zoom {
                top: auto !important;
                bottom: 80px !important;
                left: 16px !important;
                background: transparent !important;
                padding: 0 !important;
            }

            .ol-zoom button {
                background: rgba(15, 23, 42, 0.9) !important;
                color: #f8fafc !important;
                border-radius: 8px !important;
                width: 40px !important;
                height: 40px !important;
                font-size: 18px !important;
                font-weight: bold;
                border: 1px solid rgba(255,255,255,0.15) !important;
                margin-bottom: 6px !important;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
            }

            .ol-zoom button:hover {
                background: #2563eb !important;
                color: #ffffff !important;
            }

            /* North Arrow Indicator */
            .north-arrow-card {
                position: absolute;
                top: 70px;
                right: 16px;
                z-index: 1000;
                width: 48px;
                height: 50px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                user-select: none;
            }

            .north-arrow-card .compass-n {
                font-size: 11px;
                font-weight: 900;
                color: #ef4444;
                line-height: 1;
                margin-bottom: 2px;
            }

            .north-arrow-card .arrow-head {
                width: 0;
                height: 0;
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-bottom: 20px solid #38bdf8;
            }

            /* Scale line styling */
            .ol-scale-line {
                background: rgba(15, 23, 42, 0.9) !important;
                border-radius: 8px !important;
                padding: 6px 14px !important;
                bottom: 20px !important;
                left: 16px !important;
                border: 1px solid rgba(255,255,255,0.2) !important;
            }

            .ol-scale-line-inner {
                border: 2px solid #38bdf8 !important;
                border-top: none !important;
                color: #f8fafc !important;
                font-weight: 700 !important;
                font-size: 11px !important;
                letter-spacing: 0.05em;
            }

            /* Coordinates status bar bottom right */
            .coords-bar {
                position: absolute;
                bottom: 20px;
                right: 16px;
                z-index: 1000;
                padding: 8px 16px;
                font-size: 12px;
                font-weight: 600;
                color: #94a3b8;
                border-radius: 10px;
            }

            /* Interactive Info Popup */
            .ol-popup {
                position: absolute;
                background-color: #0f172a;
                color: #f8fafc;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
                padding: 16px;
                border-radius: 12px;
                border: 1px solid #334155;
                bottom: 14px;
                left: -50px;
                min-width: 240px;
            }

            .ol-popup-closer {
                text-decoration: none;
                position: absolute;
                top: 10px;
                right: 12px;
                color: #64748b;
                font-weight: bold;
                font-size: 14px;
            }

            .ol-popup-closer:hover {
                color: #f8fafc;
            }

            .ol-popup-closer:after {
                content: "✕";
            }
        </style>
    </head>
    <body>
        <!-- Top Application Header -->
        <header class="top-header">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg text-sm font-bold">
                    <i class="fa-solid fa-earth-asia"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-100 tracking-wide leading-tight">Yadgir District - Karnataka</h1>
                    <p class="text-xs text-blue-400 font-medium">Enterprise Web GIS Spatial Portal</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2.5 py-1 rounded-full font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> GIS Live System
                </span>
            </div>
        </header>

        <div id="map">
            <!-- Left Action Toolbar Buttons -->
            <div class="left-toolbar">
                <button id="toggle-layer-btn" title="Toggle Layers Panel" class="gis-btn-icon bg-blue-600 text-white shadow-lg hover:bg-blue-500">
                    <i class="fa-solid fa-layer-group"></i>
                </button>
            </div>

            <!-- Left Collapsible Sidebar Panel for Layers -->
            <div id="layer-sidebar" class="left-sidebar-drawer gis-glass-panel p-4">
                <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-700/80">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-blue-400"></i>
                        <h2 class="text-sm font-bold text-slate-100 uppercase tracking-wider">Map Layer Management</h2>
                    </div>
                    <button id="close-layer-btn" class="text-slate-400 hover:text-white p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Layer List Container -->
                <div id="layer-controls-list" class="layer-scroll-container space-y-2.5 pr-1">
                    <!-- Dynamic Layer Items Injected Here -->
                </div>
            </div>

            <!-- North Arrow Indicator -->
            <div class="north-arrow-card gis-glass-panel" title="North Arrow Indicator">
                <span class="compass-n">N</span>
                <div class="arrow-head"></div>
            </div>

            <!-- Bottom Right Coordinates Display -->
            <div class="coords-bar gis-glass-panel flex items-center gap-3">
                <div class="flex items-center gap-1.5 text-slate-200">
                    <i class="fa-solid fa-crosshairs text-blue-400"></i>
                    <span id="mouse-coords">Lat: 16.7621° | Lon: 77.1377°</span>
                </div>
                <div class="h-3 w-px bg-slate-700"></div>
                <div class="text-slate-300">
                    Zoom: <span id="zoom-level" class="text-blue-400 font-bold">10</span>
                </div>
            </div>

            <!-- Info Feature Popup Overlay -->
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content" class="text-xs text-slate-200"></div>
            </div>
        </div>

        <!-- Local QGIS2Web Resources -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>

        <!-- Local Layer Vector Data & Styling Files -->
        <script src="layers/buildings_1.js"></script>
        <script src="layers/Ygd_2.js"></script>
        <script src="layers/Railway_3.js"></script>
        <script src="layers/Landuse_4.js"></script>
        <script src="layers/Watebodies_5.js"></script>
        <script src="layers/Waterbodies_1_6.js"></script>
        <script src="layers/Roads_7.js"></script>

        <script src="styles/buildings_1_style.js"></script>
        <script src="styles/Ygd_2_style.js"></script>
        <script src="styles/Railway_3_style.js"></script>
        <script src="styles/Landuse_4_style.js"></script>
        <script src="styles/Watebodies_5_style.js"></script>
        <script src="styles/Waterbodies_1_6_style.js"></script>
        <script src="styles/Roads_7_style.js"></script>

        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script>
            // Utility function to extract clean, professional titles without raw <img> tags
            function formatCleanTitle(rawTitle, index) {
                if (!rawTitle) return { name: 'Vector Layer ' + (index + 1), color: '#3b82f6' };

                // Strip out all HTML tags like <img src="..." />
                var clean = rawTitle.replace(/<[^>]*>/g, '').trim();

                var titleLower = clean.toLowerCase();
                var color = '#94a3b8'; // default slate color

                if (titleLower.includes('ygd') || titleLower.includes('boundary')) {
                    clean = 'Yadgir Boundary';
                    color = '#3b82f6'; // Blue
                } else if (titleLower.includes('building')) {
                    clean = 'Buildings';
                    color = '#f97316'; // Orange
                } else if (titleLower.includes('railway')) {
                    clean = 'Railway Network';
                    color = '#ef4444'; // Red
                } else if (titleLower.includes('landuse')) {
                    clean = 'Land Use / Land Cover';
                    color = '#84cc16'; // Lime Green
                } else if (titleLower.includes('watebodies') || titleLower.includes('water')) {
                    clean = 'Water Bodies';
                    color = '#06b6d4'; // Cyan
                } else if (titleLower.includes('road')) {
                    clean = 'Road Network';
                    color = '#eab308'; // Yellow
                } else if (titleLower.includes('osm') || titleLower.includes('standard')) {
                    clean = 'OSM Base Map';
                    color = '#64748b'; // Gray
                }

                if (!clean) clean = 'Layer ' + (index + 1);

                return { name: clean, color: color };
            }

            window.addEventListener('load', function () {
                // Ensure OpenLayers Map instance is active
                if (!window.map || typeof window.map.addControl !== 'function') {
                    var yadgirCenter = ol.proj.fromLonLat([77.1377, 16.7621]);

                    var osmBase = new ol.layer.Tile({
                        title: 'OSM Base Map',
                        type: 'base',
                        visible: true,
                        source: new ol.source.OSM()
                    });

                    var fallbackBoundary = new ol.layer.Vector({
                        title: 'Yadgir Boundary',
                        source: new ol.source.Vector({
                            features: [new ol.Feature(new ol.geom.Polygon([[
                                ol.proj.fromLonLat([76.85, 16.50]),
                                ol.proj.fromLonLat([77.40, 16.50]),
                                ol.proj.fromLonLat([77.45, 17.05]),
                                ol.proj.fromLonLat([76.80, 17.05]),
                                ol.proj.fromLonLat([76.85, 16.50])
                            ]]))]
                        }),
                        style: new ol.style.Style({
                            stroke: new ol.style.Stroke({ color: '#2563eb', width: 3 }),
                            fill: new ol.style.Fill({ color: 'rgba(37, 99, 235, 0.08)' })
                        })
                    });

                    window.map = new ol.Map({
                        target: 'map',
                        layers: [osmBase, fallbackBoundary],
                        view: new ol.View({
                            center: yadgirCenter,
                            zoom: 10
                        })
                    });
                }

                // Add Kilometre Metric Scale Bar
                if (window.map && typeof window.map.addControl === 'function') {
                    var kmScale = new ol.control.ScaleLine({
                        units: 'metric',
                        bar: false,
                        steps: 4,
                        text: true,
                        minWidth: 100
                    });
                    window.map.addControl(kmScale);
                }

                // Left Sidebar Toggle Functionality
                var sidebar = document.getElementById('layer-sidebar');
                var toggleBtn = document.getElementById('toggle-layer-btn');
                var closeBtn = document.getElementById('close-layer-btn');

                toggleBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('closed');
                });

                closeBtn.addEventListener('click', function () {
                    sidebar.classList.add('closed');
                });

                // Populate Layer Switcher with clean UI controls
                var container = document.getElementById('layer-controls-list');

                function renderLayerControls() {
                    if (!window.map || typeof window.map.getLayers !== 'function') return;

                    container.innerHTML = '';
                    var layers = window.map.getLayers().getArray();

                    layers.forEach(function (layer, idx) {
                        var rawTitle = layer.get('title') || '';
                        var info = formatCleanTitle(rawTitle, idx);

                        var card = document.createElement('div');
                        card.className = 'bg-slate-800/80 border border-slate-700/80 rounded-lg p-3 transition-all hover:border-slate-600';

                        // Card Header: Color Indicator + Layer Title + Checkbox
                        var topRow = document.createElement('div');
                        topRow.className = 'flex items-center justify-between gap-2';

                        var titleBox = document.createElement('div');
                        titleBox.className = 'flex items-center gap-2 overflow-hidden';

                        var colorDot = document.createElement('span');
                        colorDot.className = 'w-3 h-3 rounded-full flex-shrink-0';
                        colorDot.style.backgroundColor = info.color;

                        var titleText = document.createElement('span');
                        titleText.className = 'text-xs font-semibold text-slate-200 truncate';
                        titleText.innerText = info.name;

                        titleBox.appendChild(colorDot);
                        titleBox.appendChild(titleText);

                        var toggle = document.createElement('input');
                        toggle.type = 'checkbox';
                        toggle.className = 'w-4 h-4 rounded text-blue-600 bg-slate-900 border-slate-600 focus:ring-blue-500 accent-blue-600 cursor-pointer';
                        toggle.checked = layer.getVisible();

                        toggle.addEventListener('change', function () {
                            layer.setVisible(this.checked);
                        });

                        topRow.appendChild(titleBox);
                        topRow.appendChild(toggle);

                        // Opacity Control Slider
                        var opacityRow = document.createElement('div');
                        opacityRow.className = 'mt-2.5 flex items-center gap-2 pt-2 border-t border-slate-700/50';

                        var opacityLabel = document.createElement('span');
                        opacityLabel.className = 'text-[10px] text-slate-400 font-medium uppercase';
                        opacityLabel.innerText = 'Opacity';

                        var opacityInput = document.createElement('input');
                        opacityInput.type = 'range';
                        opacityInput.min = '0';
                        opacityInput.max = '1';
                        opacityInput.step = '0.05';
                        opacityInput.value = layer.getOpacity() !== undefined ? layer.getOpacity() : 1;
                        opacityInput.className = 'w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500';

                        opacityInput.addEventListener('input', function () {
                            layer.setOpacity(parseFloat(this.value));
                        });

                        opacityRow.appendChild(opacityLabel);
                        opacityRow.appendChild(opacityInput);

                        card.appendChild(topRow);
                        card.appendChild(opacityRow);
                        container.appendChild(card);
                    });
                }

                // Initial render & delayed refreshes for qgis2web layers loading dynamically
                renderLayerControls();
                setTimeout(renderLayerControls, 500);
                setTimeout(renderLayerControls, 1500);

                // Mouse Coordinates Tracking
                window.map.on('pointermove', function (evt) {
                    var lonLat = ol.proj.toLonLat(evt.coordinate);
                    if (lonLat && lonLat.length >= 2) {
                        document.getElementById('mouse-coords').innerText =
                            'Lat: ' + lonLat[1].toFixed(4) + '° | Lon: ' + lonLat[0].toFixed(4) + '°';
                    }
                });

                // Zoom Tracker
                window.map.getView().on('change:resolution', function () {
                    document.getElementById('zoom-level').innerText = Math.round(window.map.getView().getZoom());
                });

                // Feature Click Popup
                var popupElem = document.getElementById('popup');
                var popupContent = document.getElementById('popup-content');
                var popupCloser = document.getElementById('popup-closer');

                var popupOverlay = new ol.Overlay({
                    element: popupElem,
                    autoPan: true,
                    autoPanAnimation: { duration: 250 }
                });
                window.map.addOverlay(popupOverlay);

                popupCloser.onclick = function () {
                    popupOverlay.setPosition(undefined);
                    popupCloser.blur();
                    return false;
                };

                window.map.on('singleclick', function (evt) {
                    var feature = window.map.forEachFeatureAtPixel(evt.pixel, function (f) { return f; });
                    if (feature) {
                        var props = feature.getProperties();
                        var html = '<div class="font-bold text-blue-400 border-b border-slate-700 pb-1 mb-2">Feature Information</div>';
                        for (var k in props) {
                            if (k !== 'geometry') {
                                html += '<div class="py-0.5"><span class="font-semibold text-slate-400">' + k + ':</span> ' + props[k] + '</div>';
                            }
                        }
                        popupContent.innerHTML = html;
                        popupOverlay.setPosition(evt.coordinate);
                    }
                });
            });
        </script>
    </body>
</html>
