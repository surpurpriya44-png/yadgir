<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Yadgir District, Karnataka | GIS Dashboard</title>

        <!-- Core Stylesheets -->
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">

        <style>
            :root {
                --gis-primary: #12284c;
                --gis-accent: #1e88e5;
                --gis-border: #cbd5e1;
                --panel-bg: rgba(255, 255, 255, 0.94);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                background-color: #f1f5f9;
            }

            /* HIDE QGIS2WEB DEFAULT CONFLICTING CONTROLS */
            .ol-layerswitcher,
            .layer-switcher,
            .layer-switcher.shown {
                display: none !important;
                visibility: hidden !important;
            }

            #app-container {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100vw;
            }

            /* Dashboard Header */
            #header {
                height: 48px;
                background-color: var(--gis-primary);
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
                z-index: 1000;
            }

            #header .title-group h1 {
                font-size: 1.05rem;
                font-weight: 700;
                letter-spacing: 0.3px;
                line-height: 1.2;
            }

            #header .title-group span {
                font-size: 0.72rem;
                color: #94a3b8;
            }

            #header .meta-tag {
                font-size: 0.70rem;
                background-color: rgba(255, 255, 255, 0.12);
                padding: 4px 8px;
                border-radius: 4px;
                font-family: monospace;
            }

            /* Main Map Stage */
            #workspace {
                position: relative;
                flex: 1;
                width: 100%;
                height: calc(100vh - 48px);
            }

            #map {
                width: 100%;
                height: 100%;
            }

            /* Unified GIS Layer TOC & Symbology Panel */
            #custom-toc {
                position: absolute;
                top: 14px;
                left: 14px;
                width: 260px;
                background: var(--panel-bg);
                backdrop-filter: blur(6px);
                border: 1px solid var(--gis-border);
                border-radius: 6px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.15);
                z-index: 950;
                overflow: hidden;
            }

            .toc-header {
                background: #e2e8f0;
                color: #1e293b;
                font-weight: 700;
                font-size: 0.75rem;
                padding: 8px 12px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                border-bottom: 1px solid var(--gis-border);
            }

            .toc-content {
                padding: 10px 12px;
                max-height: calc(100vh - 170px);
                overflow-y: auto;
            }

            .section-label {
                font-size: 0.68rem;
                font-weight: 700;
                color: #64748b;
                text-transform: uppercase;
                margin-top: 8px;
                margin-bottom: 6px;
                border-bottom: 1px solid #e2e8f0;
                padding-bottom: 2px;
            }

            .section-label:first-child {
                margin-top: 0;
            }

            .layer-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
                font-size: 0.8rem;
                color: #334155;
                cursor: pointer;
            }

            .layer-row input {
                cursor: pointer;
                accent-color: var(--gis-accent);
            }

            /* Professional GIS Symbology Swatches */
            .symbol {
                width: 14px;
                height: 14px;
                border-radius: 2px;
                display: inline-block;
                flex-shrink: 0;
            }
            .sym-boundary { background: transparent; border: 2px dashed #d32f2f; }
            .sym-landuse { background: #bfe5bf; border: 1px solid #7cb342; }
            .sym-buildings { background: #c2a5cf; border: 1px solid #8e44ad; }
            .sym-roads { background: #e41a1c; height: 3px; border: none; }
            .sym-railway { background: #111; height: 3px; border-top: 1px dashed #fff; border-bottom: 1px dashed #fff; }
            .sym-water { background: #29b6f6; border: 1px solid #0288d1; }

            /* Pure Minimalist North Arrow */
            #north-arrow {
                position: absolute;
                top: 14px;
                right: 14px;
                background: var(--panel-bg);
                border: 1px solid var(--gis-border);
                padding: 6px;
                border-radius: 6px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
                z-index: 950;
                pointer-events: none;
            }

            #north-arrow svg {
                width: 26px;
                height: 38px;
                display: block;
            }

            /* Bottom Status Bar */
            #status-bar {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 26px;
                background: rgba(255, 255, 255, 0.95);
                border-top: 1px solid var(--gis-border);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 12px;
                font-size: 0.72rem;
                color: #334155;
                z-index: 900;
            }

            .coord-box {
                font-family: Consolas, Monaco, monospace;
                font-weight: 600;
            }

            /* Scale Line Override */
            .ol-scale-line {
                position: static !important;
                background: transparent !important;
                padding: 0 !important;
            }

            .ol-scale-line-inner {
                border: 2px solid #000 !important;
                border-top: none !important;
                color: #000 !important;
                font-size: 10px !important;
                font-weight: bold !important;
                line-height: 1 !important;
                padding: 1px !important;
            }

            /* Keep zoom buttons top right, below the North arrow */
            .ol-zoom {
                top: 70px !important;
                right: 14px !important;
                left: auto !important;
            }

            .ol-zoom button {
                background: var(--panel-bg) !important;
                color: #1e293b !important;
                border: 1px solid var(--gis-border) !important;
                border-radius: 4px !important;
                margin-bottom: 3px !important;
            }
        </style>
    </head>
    <body>
        <div id="app-container">
            <!-- Top Dashboard Header -->
            <header id="header">
                <div class="title-group">
                    <h1>Yadgir District, Karnataka</h1>
                    <span>Thematic Spatial Geo-Dashboard | Department of Geography & GIS</span>
                </div>
                <div class="meta-tag">WGS 84 / Web Mercator</div>
            </header>

            <!-- Map View Area -->
            <div id="workspace">
                <div id="map">
                    <div id="popup" class="ol-popup">
                        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                        <div id="popup-content"></div>
                    </div>
                </div>

                <!-- Custom Clean GIS TOC & Legend -->
                <aside id="custom-toc">
                    <div class="toc-header">Layers & Symbology</div>
                    <div class="toc-content">
                        <!-- Basemap Switcher -->
                        <div class="section-label">Basemaps</div>
                        <label class="layer-row">
                            <input type="radio" name="basemap" value="osm" checked>
                            <span>OpenStreetMap</span>
                        </label>
                        <label class="layer-row">
                            <input type="radio" name="basemap" value="groads">
                            <span>Google Roads</span>
                        </label>
                        <label class="layer-row">
                            <input type="radio" name="basemap" value="gsatellite">
                            <span>Google Satellite</span>
                        </label>

                        <!-- Thematic Data Layers -->
                        <div class="section-label">Vector Layers</div>
                        <label class="layer-row">
                            <input type="checkbox" id="chk-boundary" checked>
                            <span class="symbol sym-boundary"></span>
                            <span>District Boundary</span>
                        </label>
                        <label class="layer-row">
                            <input type="checkbox" id="chk-landuse" checked>
                            <span class="symbol sym-landuse"></span>
                            <span>Land Use / Cover</span>
                        </label>
                        <label class="layer-row">
                            <input type="checkbox" id="chk-buildings" checked>
                            <span class="symbol sym-buildings"></span>
                            <span>Settlements / Buildings</span>
                        </label>
                        <label class="layer-row">
                            <input type="checkbox" id="chk-roads" checked>
                            <span class="symbol sym-roads"></span>
                            <span>Road Network</span>
                        </label>
                        <label class="layer-row">
                            <input type="checkbox" id="chk-railway" checked>
                            <span class="symbol sym-railway"></span>
                            <span>Railway Line</span>
                        </label>
                        <label class="layer-row">
                            <input type="checkbox" id="chk-waterbodies" checked>
                            <span class="symbol sym-water"></span>
                            <span>Waterbodies</span>
                        </label>
                    </div>
                </aside>

                <!-- Professional Minimalist North Arrow (No Text) -->
                <div id="north-arrow" title="North">
                    <svg viewBox="0 0 100 130">
                        <polygon points="50,5 20,70 50,55" fill="#1b365d" />
                        <polygon points="50,5 80,70 50,55" fill="#dc2626" />
                        <line x1="50" y1="55" x2="50" y2="100" stroke="#1b365d" stroke-width="4"/>
                        <text x="50" y="124" font-size="22" font-weight="900" text-anchor="middle" fill="#1b365d" font-family="sans-serif">N</text>
                    </svg>
                </div>

                <!-- Footer Status (Scale Bar & Coordinates) -->
                <footer id="status-bar">
                    <div id="scale-container"></div>
                    <div class="coord-box">
                        <span>Lat / Lon: </span>
                        <span id="coord-display">--.----° N, --.----° E</span>
                    </div>
                </footer>
            </div>
        </div>

        <!-- Script Dependencies -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>

        <!-- GIS Data Sources -->
        <script src="layers/Yadgir_Boundary_2.js"></script>
        <script src="layers/buildings_3.js"></script>
        <script src="layers/Landuse_4.js"></script>
        <script src="layers/Roads_5.js"></script>
        <script src="layers/Railway_6.js"></script>
        <script src="layers/Watebodies_7.js"></script>
        <script src="layers/Waterbodies_1_8.js"></script>

        <!-- Symbology Styles -->
        <script src="styles/Yadgir_Boundary_2_style.js"></script>
        <script src="styles/buildings_3_style.js"></script>
        <script src="styles/Landuse_4_style.js"></script>
        <script src="styles/Roads_5_style.js"></script>
        <script src="styles/Railway_6_style.js"></script>
        <script src="styles/Watebodies_7_style.js"></script>
        <script src="styles/Waterbodies_1_8_style.js"></script>

        <!-- QGIS Core Inits -->
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <!-- Cartographic Control & Basemap Switcher Logic -->
        <script>
            (function initDashboard() {
                if (typeof map === 'undefined') return;

                // 1. Metric Scalebar in Bottom Status Bar
                var scaleLine = new ol.control.ScaleLine({
                    units: 'metric',
                    target: document.getElementById('scale-container'),
                    className: 'ol-scale-line',
                    minWidth: 90
                });
                map.addControl(scaleLine);

                // 2. Cursor Coordinates Display (EPSG:4326 Lat/Lon)
                map.on('pointermove', function(evt) {
                    var coords = ol.proj.toLonLat(evt.coordinate);
                    var lon = coords[0];
                    var lat = coords[1];
                    var latStr = Math.abs(lat).toFixed(4) + '° ' + (lat >= 0 ? 'N' : 'S');
                    var lonStr = Math.abs(lon).toFixed(4) + '° ' + (lon >= 0 ? 'E' : 'W');
                    document.getElementById('coord-display').textContent = latStr + ', ' + lonStr;
                });

                // 3. Reliable Basemaps (Using robust Google Tile servers)
                var osmBase = new ol.layer.Tile({
                    source: new ol.source.OSM(),
                    visible: true,
                    zIndex: 0
                });

                var gRoads = new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: 'https://mt0.google.com/vt/lyrs=m&hl=en&x={x}&y={y}&z={z}',
                        crossOrigin: 'anonymous'
                    }),
                    visible: false,
                    zIndex: 0
                });

                var gSatellite = new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: 'https://mt0.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}',
                        crossOrigin: 'anonymous'
                    }),
                    visible: false,
                    zIndex: 0
                });

                // Add basemaps at the base of the stack
                var layersCollection = map.getLayers();
                layersCollection.insertAt(0, gSatellite);
                layersCollection.insertAt(0, gRoads);
                layersCollection.insertAt(0, osmBase);

                // Basemap Radio Buttons Listener
                var radios = document.querySelectorAll('input[name="basemap"]');
                radios.forEach(function(radio) {
                    radio.addEventListener('change', function() {
                        osmBase.setVisible(this.value === 'osm');
                        gRoads.setVisible(this.value === 'groads');
                        gSatellite.setVisible(this.value === 'gsatellite');
                        map.renderSync();
                    });
                });

                // 4. Hook Thematic Vector Layers to Checkboxes
                function setupToggle(id, layer) {
                    var el = document.getElementById(id);
                    if (el && layer) {
                        el.checked = layer.getVisible();
                        el.addEventListener('change', function() {
                            layer.setVisible(this.checked);
                        });
                    }
                }

                if (typeof lyr_Yadgir_Boundary_2 !== 'undefined') setupToggle('chk-boundary', lyr_Yadgir_Boundary_2);
                if (typeof lyr_Landuse_4 !== 'undefined') setupToggle('chk-landuse', lyr_Landuse_4);
                if (typeof lyr_buildings_3 !== 'undefined') setupToggle('chk-buildings', lyr_buildings_3);
                if (typeof lyr_Roads_5 !== 'undefined') setupToggle('chk-roads', lyr_Roads_5);
                if (typeof lyr_Railway_6 !== 'undefined') setupToggle('chk-railway', lyr_Railway_6);

                var waterEl = document.getElementById('chk-waterbodies');
                if (waterEl) {
                    waterEl.addEventListener('change', function() {
                        if (typeof lyr_Watebodies_7 !== 'undefined') lyr_Watebodies_7.setVisible(this.checked);
                        if (typeof lyr_Waterbodies_1_8 !== 'undefined') lyr_Waterbodies_1_8.setVisible(this.checked);
                    });
                }
            })();
        </script>
    </body>
</html>
